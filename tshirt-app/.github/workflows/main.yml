name: Deploy Ionic App Locally

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Existing Container
        run: |
          docker stop ionic-firestore-crud-container 2>$null || true
          docker rm ionic-firestore-crud-container 2>$null || true

      - name: Build Docker Image
        run: docker build -t tshirt-app-img .

      - name: Run Docker Container
        run: docker run -d -p 8100:8100 --name ionic-firestore-crud-container tshirt-app-img
