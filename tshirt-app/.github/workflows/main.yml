name: Deploy Ionic App Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, x64]
    
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic Docker image
        run: docker build -t tshirt-app-img .

      - name: Remove previous container
        run: docker rm -f tshirt-container
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name tshirt-container --restart unless-stopped -p 8100:8100 tshirt-app-img

      - name: Verify app
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8100/" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $success = $true
                Write-Output "Application verified successfully!"
                break
              }
            } catch {
              Write-Output "Waiting for app to start... (Attempt $i/15)"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            Write-Error "Container failed to respond on port 8100!"
            docker logs tshirt-container
            exit 1
          }